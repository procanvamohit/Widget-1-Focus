<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nothing Focus Widget</title>
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
            --accent-color: #ffffff;
            --gray-muted: #666666;
            --card-bg: #0b0b0b;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .widget-container {
            width: 100%;
            max-width: 400px;
            height: 100vh;
            max-height: 400px;
            background: var(--card-bg);
            padding: 24px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border-radius: 0;
        }

        /* Seamless integration styling for home screen widgets */
        @media (min-width: 480px) {
            .widget-container {
                border: 1px solid #1a1a1a;
                border-radius: 32px;
                height: 400px;
            }
        }

        .header-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .mode-toggle {
            display: flex;
            background: #1c1c1e;
            border-radius: 20px;
            padding: 4px;
        }

        .mode-btn {
            background: transparent;
            border: none;
            color: var(--gray-muted);
            padding: 8px 16px;
            border-radius: 16px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            letter-spacing: 0.5px;
            transition: all 0.2s ease;
        }

        .mode-btn.active {
            background: #ffffff;
            color: #000000;
        }

        .audio-control {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            color: #e5e5ea;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 46px;
            height: 26px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #3a3a3c;
            transition: .2s;
            border-radius: 26px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .2s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #34c759;
        }

        input:checked + .slider:before {
            transform: translateX(20px);
        }

        .timer-display {
            text-align: center;
            margin: auto 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .time {
            font-size: 72px;
            font-weight: 700;
            letter-spacing: -2px;
            font-variant-numeric: tabular-nums;
            line-height: 1;
            margin-bottom: 12px;
        }

        .time-setter {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        .set-btn {
            background: #1c1c1e;
            border: none;
            color: var(--text-color);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .action-container {
            display: flex;
            justify-content: center;
            margin-bottom: 16px;
        }

        .main-btn {
            background: var(--text-color);
            color: var(--bg-color);
            border: none;
            padding: 14px 0;
            border-radius: 28px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            width: 80%;
            letter-spacing: 0.5px;
        }

        .main-btn.running {
            background: transparent;
            border: 2px solid var(--text-color);
            color: var(--text-color);
        }

        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: var(--gray-muted);
            padding-top: 8px;
        }

        .tagline {
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .log-counter {
            font-variant-numeric: tabular-nums;
        }
    </style>
</head>
<body>

    <div class="widget-container">
        <div class="header-controls">
            <div class="mode-toggle">
                <button class="mode-btn active" id="focusModeBtn" onclick="setMode('focus')">FOCUS</button>
                <button class="mode-btn" id="breakModeBtn" onclick="setMode('break')">BREAK</button>
            </div>
            
            <div class="audio-control">
                <span>40Hz Beat</span>
                <label class="switch">
                    <input type="checkbox" id="audioToggle" onchange="toggleAudio(this.checked)">
                    <span class="slider"></span>
                </label>
            </div>
        </div>

        <div class="timer-display">
            <div class="time" id="timeDisplay">25:00</div>
            <div class="time-setter" id="setterControls">
                <button class="set-btn" onclick="adjustTime(-5)">-</button>
                <span style="font-size: 13px; color: var(--gray-muted);">5 Min Steps</span>
                <button class="set-btn" onclick="adjustTime(5)">+</button>
            </div>
        </div>

        <div class="action-container">
            <button class="main-btn" id="actionBtn" onclick="toggleTimer()">START</button>
        </div>

        <div class="footer">
            <div class="tagline">TIME IS MONEY</div>
            <div class="log-counter" id="logDisplay">Sessions: 0</div>
        </div>
    </div>

    <script>
        let timerInterval = null;
        let isRunning = false;
        let currentMode = 'focus'; 
        let focusDuration = 25 * 60; 
        let breakDuration = 5 * 60;  
        let timeLeft = focusDuration;
        let sessionCount = 0;

        let audioCtx = null;
        let leftOsc = null;
        let rightOsc = null;
        let gainNode = null;

        function updateDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            document.getElementById('timeDisplay').innerText = 
                `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        function setMode(mode) {
            if (isRunning) return; 
            currentMode = mode;
            document.getElementById('focusModeBtn').classList.toggle('active', mode === 'focus');
            document.getElementById('breakModeBtn').classList.toggle('active', mode === 'break');
            timeLeft = (mode === 'focus') ? focusDuration : breakDuration;
            updateDisplay();
        }

        function adjustTime(amountMinutes) {
            if (isRunning) return;
            let currentTarget = (currentMode === 'focus') ? focusDuration : breakDuration;
            let newTarget = currentTarget + (amountMinutes * 60);
            
            if (newTarget >= 300 && newTarget <= 7200) { // Limit parameters check
                if (currentMode === 'focus') {
                    focusDuration = newTarget;
                } else {
                    breakDuration = newTarget;
                }
                timeLeft = newTarget;
                updateDisplay();
            }
        }

        function toggleTimer() {
            const btn = document.getElementById('actionBtn');
            const setter = document.getElementById('setterControls');

            if (isRunning) {
                clearInterval(timerInterval);
                isRunning = false;
                btn.innerText = "START";
                btn.classList.remove('running');
                setter.style.visibility = "visible";
                stopBinauralBeats();
            } else {
                isRunning = true;
                btn.innerText = "PAUSE";
                btn.classList.add('running');
                setter.style.visibility = "hidden";
                
                if (document.getElementById('audioToggle').checked) {
                    startBinauralBeats();
                }

                timerInterval = setInterval(() => {
                    if (timeLeft > 0) {
                        timeLeft--;
                        updateDisplay();
                    } else {
                        clearInterval(timerInterval);
                        isRunning = false;
                        btn.innerText = "START";
                        btn.classList.remove('running');
                        setter.style.visibility = "visible";
                        stopBinauralBeats();
